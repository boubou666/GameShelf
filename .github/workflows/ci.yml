name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check release metadata
        run: npm run release:check
      - name: Test library and release behavior
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install test browser
        run: npx playwright install chromium
      - name: Test browser interface
        run: npx playwright test
      - name: Build Windows executable and installer
        run: npm run package
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/gameshelf.exe -Destination artifacts/GameShelf.exe
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination artifacts
          Get-ChildItem -LiteralPath artifacts -Filter '*.exe' | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            $_.Hash.ToLowerInvariant() + '  ' + (Split-Path -Leaf $_.Path)
          } | Set-Content -LiteralPath artifacts/SHA256SUMS.txt
      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GameShelf-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
