name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require a merged commit and matching changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must reference commits merged into main.' }
          node scripts/release.mjs check "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed.' }

  build:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish changelog-based release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download validated Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GameShelf-windows-x64
          path: artifacts
      - name: Write curated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs notes "$env:RELEASE_TAG" | Set-Content -LiteralPath release-notes.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract release notes.' }
      - name: Publish release and Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "GameShelf $env:RELEASE_TAG" --notes-file release-notes.md
